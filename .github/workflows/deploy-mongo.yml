name: Deploy MongoDB to GKE

on:
  push:
    tags:
      - 'mongo-*'
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'your-gcp-project-id' }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER || 'frameverse-cluster' }}
  GKE_ZONE: ${{ vars.GKE_ZONE || 'asia-south1-a' }}

jobs:
  deploy-mongo:
    name: Deploy MongoDB to GKE
    runs-on: ubuntu-latest
    # If triggered by release, only run if tag starts with 'mongo-'
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'mongo-')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Connect to GKE Cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME || env.GKE_CLUSTER }}
          location: ${{ secrets.GKE_CLUSTER_REGION || env.GKE_ZONE }}

      - name: Substitute Secret Variables (if configured)
        env:
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME || 'frameverse' }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD || 'YOUR_SECURE_PASSWORD' }}
        run: |
          if [ -n "${{ secrets.MONGO_PASSWORD }}" ]; then
            sed -i "s/password: YOUR_SECURE_PASSWORD/password: $MONGO_PASSWORD/g" deployments/mongo.yaml
          fi
          if [ -n "${{ secrets.MONGO_USERNAME }}" ]; then
            sed -i "s/username: frameverse/username: $MONGO_USERNAME/g" deployments/mongo.yaml
          fi

      - name: Apply MongoDB Manifests
        run: |
          echo "=========================================================="
          echo "🍃 Deploying MongoDB manifests to GKE..."
          echo "=========================================================="
          kubectl apply -f deployments/mongo.yaml

      - name: Verify Rollout Status
        run: |
          echo "Waiting for MongoDB pod to be ready..."
          kubectl rollout status deployment/mongo --timeout=180s
          echo "=========================================================="
          echo "✅ MongoDB is LIVE on GKE!"
          echo "=========================================================="
          kubectl get pods -l app=mongo
          kubectl get pvc mongo-pvc
          kubectl get svc mongo
