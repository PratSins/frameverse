apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: letsencrypt-prod
    app.kubernetes.io/part-of: frameverse-gateway
spec:
  acme:
    # Let's Encrypt Production ACME v2 Directory
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      # Secret where the ACME account private key is stored
      name: letsencrypt-prod-account-key
    solvers:
    # HTTP-01 challenge solver using NGINX Ingress
    - http01:
        ingress:
          class: nginx
